<!DOCTYPE html>
<html lang="{{ language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('Log in') }} | Nuvio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <img src="/static/logo.svg" alt="Nuvio" class="login-logo-img">
        <h1>Nuvio</h1>
        <p class="login-subtitle">{{ t('Analytics dashboard') }}</p>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">{{ t('Username') }}</label>
                <input type="text" id="username" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">{{ t('Password') }}</label>
                <input type="password" id="password" name="password" placeholder="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">{{ t('Log in') }}</button>
        </form>
        <div class="language-switch login-language" role="group" aria-label="{{ t('Language') }}">
            <a href="/language/en?next=/login" lang="en" hreflang="en" aria-label="English" {% if language == 'en' %}aria-current="true"{% endif %}>EN</a>
            <a href="/language/ru?next=/login" lang="ru" hreflang="ru" aria-label="Русский" {% if language == 'ru' %}aria-current="true"{% endif %}>RU</a>
        </div>
    </div>
</body>
</html>
