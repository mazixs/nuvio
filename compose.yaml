name: nuvio

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  telegram-bot-api:
    build:
      context: .
      dockerfile: Dockerfile.telegram-bot-api
    image: nuvio-telegram-bot-api:10.2
    # Образа нет ни в одном реестре — он собирается здесь. Без явной политики
    # Compose при связке `build` + `image` сначала идёт за ним в реестр, и
    # `docker compose pull` падает с «pull access denied», обрывая обновление
    # всего стека. `build` заставляет Compose пропустить pull и собрать образ.
    pull_policy: build
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
    command:
      - --local
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
      - --temp-dir=/var/lib/telegram-bot-api/temp
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - shared-media:/app/media
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging: *logging

  bot:
    image: ghcr.io/mazixs/nuvio:${TAG:-latest}
    restart: unless-stopped
    env_file: ${NUVIO_ENV_FILE:-.secrets/.env}
    environment:
      DATA_DIR: /app/data
      TEMP_DIR: /app/media
      TELEGRAM_LOCAL_MODE: "true"
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081/bot
      TELEGRAM_BOT_API_FILE_URL: http://telegram-bot-api:8081/file/bot
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    volumes:
      - bot-data:/app/data
      - shared-media:/app/media
      # Файлы, загруженные админом в чат, локальный Bot API кладёт себе, а
      # `getFile` возвращает абсолютный путь вместо URL. PTB считает путь
      # локальным только если видит файл у себя — без этого тома загрузка
      # cookies падает с «Not Found». Только чтение: PTB копирует из него.
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
      - ./logs:/app/logs
      - ./.secrets:/app/.secrets
    logging: *logging

  web:
    image: ghcr.io/mazixs/nuvio:${TAG:-latest}
    restart: unless-stopped
    # Через пакет, а не через `web.app`: `web/__main__.py` — единственная точка
    # входа, описанная в документации, иначе она мертва в проде.
    command: python -m web
    env_file: ${NUVIO_ENV_FILE:-.secrets/.env}
    environment:
      DATA_DIR: /app/data
      WEB_PORT: "8080"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *logging

  api:
    image: ghcr.io/mazixs/nuvio:${TAG:-latest}
    restart: unless-stopped
    # Внешний API открывает наружу новый порт, поэтому включается явно:
    # `--profile api` или `COMPOSE_PROFILES=api`.
    profiles: ["api"]
    command: python -m api
    env_file: ${NUVIO_ENV_FILE:-.secrets/.env}
    environment:
      DATA_DIR: /app/data
      TEMP_DIR: /app/media
      API_PORT: "8090"
      # Уведомления админов о сбоях идут тем же сервером Bot API, что у бота.
      # Лимит размера файла задаёт API_MAX_FILE_SIZE_MB, а не режим Telegram.
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081/bot
    ports:
      - "${API_PORT:-8090}:8090"
    volumes:
      # Ключи лежат в общей analytics.db, рабочие копии cookies — рядом.
      - bot-data:/app/data
      # Свой том: файлы API не нужны локальному Bot API и не попадают под
      # суточную чистку временных файлов бота.
      - api-media:/app/media
      # Cookies, загруженные админом через бота; API их только читает.
      - ./.secrets:/app/.secrets:ro
      # Свой файл api.log рядом с bot.log: ротация двух процессов не пересекается.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *logging

volumes:
  bot-data:
  telegram-bot-api-data:
  shared-media:
  api-media:
