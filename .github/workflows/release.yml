name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Имя образа закреплено отдельно от имени репозитория и должно совпадать
  # с compose.yaml. Docker ref требует нижний регистр.
  REGISTRY_IMAGE: ghcr.io/mazixs/nuvio
  TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  VALID_TAG_REGEX: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

jobs:
  test:
    name: Тесты перед релизом
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Проверка тега и принадлежности main
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ $VALID_TAG_REGEX ]]; then
            echo "Некорректный тег релиза: $GITHUB_REF_NAME"
            exit 1
          fi

          git fetch --no-tags origin main
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Commit $TAG_COMMIT не входит в origin/main"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: python -m pip install --requirement requirements-dev.txt

      - name: Проверка стиля
        run: ruff check --output-format=github .

      - name: Полный набор тестов с покрытием
        run: |
          coverage run --branch -m pytest tests/
          coverage report --fail-under=70

  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test]
    permissions:
      contents: read
      packages: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Авторизация в GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные Docker
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # latest задаётся явно: compose читает образ как `${TAG:-latest}`,
          # поэтому пометить предрелиз как latest значило бы раздать RC всем,
          # кто поднимает стек без TAG.
          flavor: latest=${{ !contains(github.ref_name, '-') }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Сборка canonical digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=nuvio-release
          cache-to: type=gha,mode=max,scope=nuvio-release
          provenance: mode=max
          sbom: true

      - name: Загрузка canonical digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$REGISTRY_IMAGE@$IMAGE_DIGEST"

      - name: Проверка digest на исправимые уязвимости
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume nuvio-trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "$REGISTRY_IMAGE@$IMAGE_DIGEST"

      - name: Smoke-проверка опубликованного digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --detach --name nuvio-release-smoke \
            --publish 127.0.0.1:18080:8080 \
            "$REGISTRY_IMAGE@$IMAGE_DIGEST" python -m web
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              exit 0
            fi
            echo "WebUI ещё не готов: попытка ${attempt}/20"
            sleep 1
          done
          docker logs nuvio-release-smoke
          exit 1

      - name: Проверка медиа-компонентов опубликованного digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm "$REGISTRY_IMAGE@$IMAGE_DIGEST" python -m scripts.check_media_runtime

      - name: Проверка создания бота из опубликованного digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm \
            --env TELEGRAM_TOKEN=123456:abcdefghijklmnopqrstuvwxyz123456 \
            --env ADMIN_IDS=1 \
            "$REGISTRY_IMAGE@$IMAGE_DIGEST" python -m scripts.check_bot_startup

      - name: Остановка release smoke-контейнера
        if: always()
        run: docker rm --force nuvio-release-smoke || true

      - name: Публикация проверенных тегов
        env:
          DOCKER_TAGS: ${{ steps.docker_meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$DOCKER_TAGS"

          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "docker/metadata-action не сформировал теги"
            exit 1
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$REGISTRY_IMAGE@$IMAGE_DIGEST"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Метаданные версии
        id: meta
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Генерация release notes
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CURRENT_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" --match "v[0-9]*" 2>/dev/null || true)

          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          else
            RANGE="$CURRENT_TAG"
          fi

          python3 scripts/release_notes.py \
            "$RANGE" "$VERSION" "$GITHUB_REPOSITORY" "$NOTES_PATH"

          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Создание GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Nuvio v${{ steps.meta.outputs.version }}"
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
