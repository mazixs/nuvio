name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  lint:
    name: Линтинг
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка инструментов разработки
        run: python -m pip install --requirement requirements-dev.txt

      - name: Проверка GitHub Actions
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            "$ACTIONLINT_IMAGE" \
            -color .github/workflows/*.yml

      - name: Проверка стиля кода
        run: ruff check --output-format=github .

  test:
    name: Тесты (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: python -m pip install --requirement requirements-dev.txt

      - name: Полный набор тестов с покрытием
        run: |
          coverage run --branch -m pytest tests/
          coverage report --fail-under=70

  docker-build:
    name: Проверка Docker-сборки
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Проверка Compose
        env:
          NUVIO_ENV_FILE: /dev/null
          TELEGRAM_API_ID: "12345"
          TELEGRAM_API_HASH: test-api-hash
        run: docker compose -f compose.yaml config --quiet

      - name: Сборка образа Nuvio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nuvio:test
          cache-from: type=gha,scope=nuvio
          cache-to: type=gha,mode=max,scope=nuvio

      - name: Сборка локального Telegram Bot API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.telegram-bot-api
          load: true
          tags: nuvio-telegram-bot-api:test
          cache-from: type=gha,scope=telegram-bot-api
          cache-to: type=gha,mode=max,scope=telegram-bot-api

      - name: Проверка исполняемого файла Telegram Bot API
        run: docker run --rm nuvio-telegram-bot-api:test --version

      - name: Проверка образов на исправимые уязвимости
        run: |
          for image in nuvio:test nuvio-telegram-bot-api:test; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume nuvio-trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image \
              --scanners vuln \
              --exit-code 1 \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              "$image"
          done

      - name: Проверка медиа-компонентов образа
        run: docker run --rm nuvio:test python -m scripts.check_media_runtime

      - name: Проверка создания бота из образа
        run: |
          docker run --rm \
            --env TELEGRAM_TOKEN=123456:abcdefghijklmnopqrstuvwxyz123456 \
            --env ADMIN_IDS=1 \
            nuvio:test python -m scripts.check_bot_startup

      - name: Запуск WebUI из собранного образа
        run: |
          docker run --detach --name nuvio-web-smoke \
            --publish 127.0.0.1:18080:8080 \
            nuvio:test python -m web
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              exit 0
            fi
            echo "WebUI ещё не готов: попытка ${attempt}/20"
            sleep 1
          done
          docker logs nuvio-web-smoke
          exit 1

      - name: Остановка WebUI smoke-контейнера
        if: always()
        run: docker rm --force nuvio-web-smoke || true
