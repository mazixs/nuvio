name: Предложение обновления yt-dlp

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Установка инструментов
        run: |
          python -m pip install uv==0.11.21
          python -m pip install --requirement requirements-dev.txt
      - name: Подготовка точного обновления
        id: version
        run: |
          version=$(python scripts/find_latest_ytdlp.py)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          python scripts/update_ytdlp.py "$version"
      - name: Создание PR при изменении версии
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git diff --quiet; then
            echo "Текущая nightly уже закреплена"
            exit 0
          fi
          branch="mzx/update-ytdlp-${VERSION}"
          existing_branch=$(
            gh pr list --state open --limit 100 --json headRefName \
              --jq "[.[] | select(.headRefName == \"$branch\" or (.headRefName | startswith(\"${branch}-retry-\"))) | .headRefName][0] // empty"
          )
          if [[ -n "$existing_branch" ]]; then
            echo "PR для версии уже открыт, повторно запускаю проверки ветки"
            gh workflow run ci.yml --ref "$existing_branch"
            gh workflow run youtube-smoke.yml --ref "$existing_branch"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            branch="${branch}-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add requirements.in requirements.txt requirements-dev.txt AGENTS.md README.ru.md docs/PRD.md docs/technical/youtube-download-runbook.md
          git commit -m "chore: update yt-dlp to ${VERSION}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update yt-dlp to ${VERSION}" \
            --body "Exact nightly pin and hashed lock files. CI and the network YouTube smoke run through workflow_dispatch because pull_request checks created with GITHUB_TOKEN require approval."
          gh workflow run ci.yml --ref "$branch"
          gh workflow run youtube-smoke.yml --ref "$branch"
