version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # yt-dlp обновляет workflow ytdlp-update через scripts/update_ytdlp.py: он же
    # правит версию в документах, без которой падают тесты. GitHub применяет это
    # правило и к обновлениям безопасности, поэтому при уязвимости yt-dlp нужно
    # запустить ytdlp-update вручную (workflow_dispatch).
    ignore:
      - dependency-name: "yt-dlp"
    groups:
      safe-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
